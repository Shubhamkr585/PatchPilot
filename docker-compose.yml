version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: patchpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: patchpilot
    ports:
      - "5433:5432"
    volumes:
      - patchpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patchpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  patchpilot_pgdata:
